<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Cutline Studio - Freelance Order, Billing & Team Manager</title>
    <meta name="description" content="Video editing and social media management client portal, order intake, freelancer task delegation, and billing manager." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Cutline" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Cutline Studio - Freelance Order, Billing & Team Manager" />
    <meta property="og:description" content="Video editing and social media management client portal, order intake, freelancer task delegation, and billing manager." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in cloud container preview per environment constraints (HMR: Disabled)
      (function() {
        // Safe WebSocket stub for vite-hmr to prevent connection attempts and close errors
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            const OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              const isHmr = (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                            (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                            (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));
              if (isHmr) {
                return {
                  readyState: 3, // CLOSED
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {
          // ignore
        }

        const origConsoleError = console.error;
        console.error = function(...args) {
          const combined = args.map(a => (a && (a.message || a.stack || String(a))) || '').join(' ');
          if (
            combined.includes('WebSocket') ||
            combined.includes('vite-hmr') ||
            combined.includes('@vite/client') ||
            (combined.includes('[vite]') && combined.includes('closed without opened'))
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          const combined = args.map(a => (a && (a.message || a.stack || String(a))) || '').join(' ');
          if (
            combined.includes('WebSocket') ||
            combined.includes('vite-hmr') ||
            combined.includes('@vite/client')
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          const msg = (e && e.message) || '';
          const fn = (e && e.filename) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('ws://') ||
            msg.includes('wss://') ||
            fn.includes('@vite/client')
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (reasonStr.includes('WebSocket') || reasonStr.includes('vite-hmr')) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen overflow-x-hidden no-scrollbar">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
